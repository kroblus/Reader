name: Android large TXT corpus

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  large-txt:
    name: 100MB TXT import regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Identify checked source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run large TXT instrumentation corpus
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            ANDROID_SERIAL=emulator-5554 bash ./gradlew :app:connectedQaAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.lightreader.app.LargeTxtImportInstrumentedTest -Pandroid.testInstrumentationRunnerArguments.runId=${{ github.run_id }}-${{ github.run_attempt }}-corpus -Pandroid.testInstrumentationRunnerArguments.sourceId=${{ steps.source.outputs.sha }} --stacktrace
      - name: Upload TXT performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-large-txt-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.source.outputs.sha }}
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/connected_android_test_additional_output/
