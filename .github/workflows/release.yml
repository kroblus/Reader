name: Signed Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ github.sha }}

  release:
    needs: quality
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality.outputs.verified_sha }}
      - name: Verify source and release tag
        env:
          VERIFIED_SHA: ${{ needs.quality.outputs.verified_sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$VERIFIED_SHA" = "$GITHUB_SHA"
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION" && test -n "$CODE"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          test -s "docs/releases/v${VERSION}.md"
          echo "EXPECTED_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "EXPECTED_CODE=$CODE" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize release keystore
        shell: bash
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lightreader-release.jks"
          test -s "$RUNNER_TEMP/lightreader-release.jks"
      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/lightreader-release.jks
        run: bash ./gradlew :app:assembleRelease --stacktrace
      - name: Verify signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signature.txt"
          CERT=$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | head -1)
          EXPECTED_CERT=$(keytool -exportcert -keystore "$RUNNER_TEMP/lightreader-release.jks" -storepass:env RELEASE_STORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          test "$CERT" = "$EXPECTED_CERT"
          # Keep updates compatible with the already-distributed signing identity.
          gh release download v0.3.4 --repo "$GITHUB_REPOSITORY" --pattern Reader-v0.3.4.apk --dir "$RUNNER_TEMP/previous-release"
          PREVIOUS_APK="$RUNNER_TEMP/previous-release/Reader-v0.3.4.apk"
          echo "2afeedb7ad2ece07a5a948060103b2017a08c84a5e1f435f78bc0f5e32b7548d  $PREVIOUS_APK" | sha256sum --check --status
          "$APKSIGNER" verify --verbose --print-certs "$PREVIOUS_APK" > "$RUNNER_TEMP/previous-signature.txt"
          PREVIOUS_CERT=$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/previous-signature.txt" | head -1)
          test -n "$PREVIOUS_CERT" && test "$CERT" = "$PREVIOUS_CERT"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.lightreader.app' versionCode='$EXPECTED_CODE' versionName='$EXPECTED_VERSION'" "$RUNNER_TEMP/badging.txt"
          sha256sum "$APK" > "$RUNNER_TEMP/apk.sha256"
      - name: Name release asset
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "Reader-v${EXPECTED_VERSION}.apk"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lightreader-signed-release
          path: Reader-v${{ env.EXPECTED_VERSION }}.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LightReader ${{ env.EXPECTED_VERSION }}
          body_path: docs/releases/v${{ env.EXPECTED_VERSION }}.md
          files: Reader-v${{ env.EXPECTED_VERSION }}.apk
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lightreader-release.jks"
