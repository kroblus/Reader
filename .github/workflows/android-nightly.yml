name: Android nightly user matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  qa-matrix:
    name: QA journeys on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Identify checked source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run complete deterministic QA matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          script: |
            ANDROID_SERIAL=emulator-5554 bash ./gradlew :app:connectedQaAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.lightreader.app.ReaderProcessRecoveryInstrumentedTest,com.lightreader.app.BackupFreshInstallInstrumentedTest,com.lightreader.app.HtmlBridgeInstrumentedTest -Pandroid.testInstrumentationRunnerArguments.runId=${{ github.run_id }}-${{ github.run_attempt }}-api${{ matrix.api-level }} -Pandroid.testInstrumentationRunnerArguments.sourceId=${{ steps.source.outputs.sha }} --stacktrace
            bash scripts/run-reader-process-recovery.sh emulator-5554 "${{ github.run_id }}-${{ github.run_attempt }}-api${{ matrix.api-level }}" "${{ steps.source.outputs.sha }}"
            python3 scripts/run-backup-fresh-install.py --serial emulator-5554 --report-root app/build/reports/backup-fresh-install
      - name: Upload nightly reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-nightly-api-${{ matrix.api-level }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.source.outputs.sha }}
          if-no-files-found: warn
          path: |
            app/build/reports/process-recovery/
            app/build/reports/backup-fresh-install/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/connected_android_test_additional_output/
